<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Label Editor - Standalone (No CORS Issues)</title>
    <style>
      :root {
        --bg: #0a0e1a;
        --panel: #141823;
        --muted: #98a9c7;
        --accent: #60d5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
        color: #e8f0ff;
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-start;
        min-height: 100vh;
      }

      /* Left Panel */
      .panel {
        width: 320px;
        background: var(--panel);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .panel h2 {
        margin: 0 0 16px;
        font-size: 20px;
        font-weight: 600;
        color: var(--accent);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .row label {
        width: 80px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
      }

      input[type="date"],
      input[type="range"],
      select {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #2a3448;
        background: #0d1117;
        color: #e8f0ff;
        font-size: 14px;
      }

      input[type="range"] {
        padding: 0;
        cursor: pointer;
      }

      #fontSizeValue {
        min-width: 45px;
        color: var(--accent);
        font-weight: 600;
        font-size: 13px;
      }

      .controls-footer {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 18px;
      }

      .controls-footer button {
        background: linear-gradient(135deg, #60d5fa 0%, #4facfe 100%);
        border: none;
        padding: 12px 16px;
        border-radius: 8px;
        cursor: pointer;
        color: #0a0e1a;
        font-weight: 700;
        font-size: 14px;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .controls-footer button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(96, 213, 250, 0.4);
      }

      .controls-footer button:active {
        transform: translateY(0);
      }

      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 12px;
        line-height: 1.5;
      }

      /* Middle - Single Label Preview */
      .editor {
        flex-shrink: 0;
        background: #1e2433;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .editor h2 {
        margin: 0 0 16px;
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
      }

      .image-wrap {
        position: relative;
        width: 400px;
        aspect-ratio: 1/1;
        border-radius: 10px;
        overflow: hidden;
        background: #0d1117;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }

      img#labelImg {
        width: 100%;
        height: 100%;
        display: block;
        user-select: none;
        object-fit: cover;
      }

      /* Overlays - MUCH Better Mobile Touch */
      .overlay {
        position: absolute;
        transform: translate(-50%, -50%);
        cursor: grab;
        user-select: none;
        text-align: center;
        background: rgba(96, 213, 250, 0.2);
        /* padding: 20px 24px; */
        z-index: 10;
        border-radius: 12px;
        border: 3px dashed rgba(96, 213, 250, 0.5);
        min-width: 180px;
        min-height: 20px;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .overlay:active,
      .overlay:hover {
        cursor: grabbing;
        background: rgba(96, 213, 250, 0.35);
        border-color: rgba(96, 213, 250, 0.8);
        border-width: 4px;
      }

      .overlay::before {
        content: "⋮⋮⋮";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        font-weight: bold;
        color: rgba(96, 213, 250, 0.4);
        pointer-events: none;
        z-index: -1;
        letter-spacing: 3px;
      }

      .overlay .title {
        display: block;
        font-weight: 900;
        font-size: 24px;
        color: #000;
        text-shadow:
          -1px -1px 0 #fff,
          1px -1px 0 #fff,
          -1px 1px 0 #fff,
          1px 1px 0 #fff,
          0 2px 4px rgba(255, 255, 255, 0.5);
      }

      .overlay .value {
        display: block;
        font-weight: 700;
        font-size: 22px;
        color: #000;

        text-shadow:
          -1px -1px 0 #fff,
          1px -1px 0 #fff,
          -1px 1px 0 #fff,
          1px 1px 0 #fff;
      }

      /* Right - A4 Preview */
      .a4-preview {
        flex: 1;
        background: #1e2433;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
      }

      .a4-preview h2 {
        margin: 0 0 16px;
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
      }

      #a4Canvas {
        border: 1px solid #2a3448;
        border-radius: 8px;
        background: white;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        max-width: 100%;
        height: auto;
      }

      /* Responsive */
      @media (max-width: 1400px) {
        body {
          flex-wrap: wrap;
        }

        .a4-preview {
          width: 100%;
          order: 3;
        }
      }

      @media (max-width: 900px) {
        body {
          flex-direction: column;
          align-items: center;
        }

        .panel {
          width: 100%;
          max-width: 500px;
        }

        .editor {
          width: 100%;
          max-width: 500px;
        }

        .image-wrap {
          width: 100%;
          max-width: 400px;
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>Label Controls</h2>

      <div class="row">
        <label>Product</label>
        <select id="productSelect">
          <option value="jelly">Jelly Pudding</option>
          <option value="watalappan">Watalappan</option>
          <option value="caramal_pudding">Caramal Pudding</option>
        </select>
      </div>

      <div class="row">
        <label></label>
        <input id="mfdInput" type="date" />
      </div>

      <div class="row">
        <label></label>
        <input id="expInput" type="date" />
      </div>

      <div class="row">
        <label>Font Size</label>
        <input id="fontSize" type="range" min="0" max="50" value="15" />
        <span id="fontSizeValue">15px</span>
      </div>

      <div class="controls-footer">
        <button id="resetBtn">Reset Position</button>
        <button id="downloadBtn">Download PNG</button>
        <button id="pdfBtn">Generate PDF (15 labels)</button>
      </div>

      <p class="hint">
        Select product, set dates, drag to position, then export PDF with 15
        labels on A4.
        <br /><br />
        ✅ <strong>This standalone version works without a server!</strong>
      </p>
    </div>

    <div class="editor">
      <h2>Single Label Preview</h2>

      <div class="image-wrap" id="imageWrap">
        <img id="labelImg" alt="Label" />

        <div
          id="mfdOverlay"
          class="overlay"
          class="overlay"
          style="left: 47.6%; top: 50.75%; cursor: grab"
        >
          <span class="title"></span>
          <span class="value" id="mfdValue"></span>
        </div>

        <div
          id="expOverlay"
          class="overlay"
          style="left: 47.4%; top: 58.75%; cursor: grab"
        >
          <span class="title"></span>
          <span class="value" id="expValue"></span>
        </div>
      </div>
    </div>

    <div class="a4-preview">
      <h2>A4 Preview (15 labels)</h2>
      <canvas id="a4Canvas"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      // ===== ARROW KEY MOVE + FOCUS FIX (ADDED) =====
      document.body.tabIndex = 0;
      document.body.focus();

      let selectedOverlay = null;
      const STEP = 0.5;
      const FAST = 2;

      document.querySelectorAll(".overlay").forEach((o) => {
        o.addEventListener("pointerdown", () => {
          document
            .querySelectorAll(".overlay")
            .forEach((x) => x.classList.remove("selected"));
          selectedOverlay = o;
          o.classList.add("selected");
          document.body.focus();
        });
      });

      document.addEventListener("keydown", (e) => {
        if (!selectedOverlay) return;

        let left = parseFloat(selectedOverlay.style.left);
        let top = parseFloat(selectedOverlay.style.top);
        const step = e.shiftKey ? FAST : STEP;

        switch (e.key) {
          case "ArrowUp":
            top -= step;
            break;
          case "ArrowDown":
            top += step;
            break;
          case "ArrowLeft":
            left -= step;
            break;
          case "ArrowRight":
            left += step;
            break;
          default:
            return;
        }

        left = Math.max(0, Math.min(100, left));
        top = Math.max(0, Math.min(100, top));

        selectedOverlay.style.left = left + "%";
        selectedOverlay.style.top = top + "%";
        e.preventDefault();
      });
    </script>

      const fontSizeValue = document.getElementById("fontSizeValue");
      const labelImg = document.getElementById("labelImg");
      const mfdOverlay = document.getElementById("mfdOverlay");
      const expOverlay = document.getElementById("expOverlay");
      const downloadBtn = document.getElementById("downloadBtn");
      const pdfBtn = document.getElementById("pdfBtn");
      const resetBtn = document.getElementById("resetBtn");
      const imageWrap = document.getElementById("imageWrap");
      const a4Canvas = document.getElementById("a4Canvas");

      // A4 dimensions at 72 DPI (standard for screen preview)
      const A4_WIDTH_PX = 595;
      const A4_HEIGHT_PX = 842;

      // Initialize A4 canvas
      a4Canvas.width = A4_WIDTH_PX;
      a4Canvas.height = A4_HEIGHT_PX;

      /* ==============
      Product Selection
      ============== */
      productSelect.addEventListener("change", () => {
        const selectedProduct = productSelect.value;
        labelImg.src = selectedProduct;
        // Wait for image to load before updating preview
        labelImg.onload = () => {
          updateA4Preview();
        };
      });

      /* ==============
      Text Updates
      ============== */
      function formatISODate(val) {
        if (!val) return "--";
        return val;
      }

      mfdInput.addEventListener("input", () => {
        mfdValue.textContent = formatISODate(mfdInput.value);
        updateA4Preview();
      });

      expInput.addEventListener("input", () => {
        expValue.textContent = formatISODate(expInput.value);
        updateA4Preview();
      });

      /* ==============
      Font Size Control
      ============== */
      function applyFontSize() {
        const size = fontSize.value + "px";
        fontSizeValue.textContent = size;

        const titleSize = parseInt(fontSize.value) + 4 + "px";

        mfdOverlay.querySelector(".title").style.fontSize = titleSize;
        mfdOverlay.querySelector(".value").style.fontSize = size;
        expOverlay.querySelector(".title").style.fontSize = titleSize;
        expOverlay.querySelector(".value").style.fontSize = size;

        updateA4Preview();
      }

      fontSize.addEventListener("input", applyFontSize);
      applyFontSize();

      /* ==============
      Dragging Overlays
      ============== */
      let dragging = null;
      let dragPointerId = null;

      function onPointerDown(e) {
        e.preventDefault(); // Prevent default touch behavior
        const el = e.currentTarget;
        dragging = el;
        dragPointerId = e.pointerId;
        el.setPointerCapture(dragPointerId);
        el.style.cursor = "grabbing";
      }

      function onPointerMove(e) {
        if (!dragging) return;
        e.preventDefault(); // Prevent scrolling while dragging
        const rect = imageWrap.getBoundingClientRect();
        let x = ((e.clientX - rect.left) / rect.width) * 100;
        let y = ((e.clientY - rect.top) / rect.height) * 100;
        x = Math.max(0.5, Math.min(99.5, x));
        y = Math.max(0.5, Math.min(99.5, y));
        dragging.style.left = x + "%";
        dragging.style.top = y + "%";

        updateA4Preview();
      }

      function onPointerUp(e) {
        if (!dragging) return;
        try {
          dragging.style.cursor = "grab";
          dragging.releasePointerCapture(dragPointerId);
        } catch (e) {}
        dragging = null;
        dragPointerId = null;
      }

      [mfdOverlay, expOverlay].forEach((el) => {
        el.addEventListener("pointerdown", onPointerDown);
      });
      document.addEventListener("pointermove", onPointerMove);
      document.addEventListener("pointerup", onPointerUp);

      /* ==============
      Draw Label on Canvas
      ============== */
      function drawLabelOnCanvas(ctx, x, y, size) {
        // Draw the image
        ctx.drawImage(labelImg, x, y, size, size);

        // Get positions from overlay styles
        const mfdLeftPct = parseFloat(mfdOverlay.style.left) / 100;
        const mfdTopPct = parseFloat(mfdOverlay.style.top) / 100;
        const expLeftPct = parseFloat(expOverlay.style.left) / 100;
        const expTopPct = parseFloat(expOverlay.style.top) / 100;

        const mfdX = x + mfdLeftPct * size;
        const mfdY = y + mfdTopPct * size;
        const expX = x + expLeftPct * size;
        const expY = y + expTopPct * size;

        // Scale font sizes
        const previewWidth = imageWrap.getBoundingClientRect().width;
        const scale = size / previewWidth;

        const titleEl = mfdOverlay.querySelector(".title");
        const valueEl = mfdOverlay.querySelector(".value");

        const computedTitleSize =
          parseFloat(window.getComputedStyle(titleEl).fontSize) || 24;
        const computedValueSize =
          parseFloat(window.getComputedStyle(valueEl).fontSize) || 22;

        const titlePx = Math.round(computedTitleSize * scale);
        const valuePx = Math.round(computedValueSize * scale);

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `900 ${titlePx}px Arial, sans-serif`;

        // Draw MFD
        // Title
        ctx.lineWidth = Math.max(2, titlePx * 0.1);
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.strokeText("", mfdX, mfdY - valuePx * 0.85);
        ctx.fillStyle = "#000";
        ctx.fillText("", mfdX, mfdY - valuePx * 0.85);

        // Value
        ctx.font = `700 ${valuePx}px Arial, sans-serif`;
        ctx.lineWidth = Math.max(1, valuePx * 0.08);
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.strokeText(mfdValue.textContent, mfdX, mfdY);
        ctx.fillStyle = "#000";
        ctx.fillText(mfdValue.textContent, mfdX, mfdY);

        // Draw EXP
        // Title
        ctx.font = `900 ${titlePx}px Arial, sans-serif`;
        ctx.lineWidth = Math.max(2, titlePx * 0.1);
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.strokeText("", expX, expY - valuePx * 0.85);
        ctx.fillStyle = "#000";
        ctx.fillText("", expX, expY - valuePx * 0.85);

        // Value
        ctx.font = `700 ${valuePx}px Arial, sans-serif`;
        ctx.lineWidth = Math.max(1, valuePx * 0.08);
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.strokeText(expValue.textContent, expX, expY);
        ctx.fillStyle = "#000";
        ctx.fillText(expValue.textContent, expX, expY);
      }

      /* ==============
      Update A4 Preview (15 labels - 3x5 grid)
      ============== */
      function updateA4Preview() {
        if (!labelImg.complete || !labelImg.naturalWidth) {
          // Image not loaded yet, try again in a moment
          setTimeout(updateA4Preview, 100);
          return;
        }

        const ctx = a4Canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, A4_WIDTH_PX, A4_HEIGHT_PX);

        // Draw a loading message if dates aren't set
        if (mfdValue.textContent === "--" && expValue.textContent === "--") {
          ctx.fillStyle = "#cccccc";
          ctx.font = "16px Arial";
          ctx.textAlign = "center";
          ctx.fillText(
            "Set dates to see preview",
            A4_WIDTH_PX / 2,
            A4_HEIGHT_PX / 2,
          );
        }

        // Label configuration for 15 labels (3 columns x 5 rows)
        const labelSizeMM = 57;
        const paddingMM = 2;
        const marginXMM = 17.5;
        const marginYMM = 2;

        // Convert mm to pixels (72 DPI: 1 inch = 25.4mm = 72px)
        const mmToPx = 72 / 25.4;
        const labelSize = labelSizeMM * mmToPx;
        const padding = paddingMM * mmToPx;
        const marginX = marginXMM * mmToPx;
        const marginY = marginYMM * mmToPx;

        const cols = 3;
        const rows = 5;

        try {
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const x = marginX + c * (labelSize + padding);
              const y = marginY + r * (labelSize + padding);
              drawLabelOnCanvas(ctx, x, y, labelSize);
            }
          }
        } catch (error) {
          console.error("Error drawing labels:", error);
          ctx.fillStyle = "#ff0000";
          ctx.font = "14px Arial";
          ctx.textAlign = "center";
          ctx.fillText(
            "Error rendering labels - check console",
            A4_WIDTH_PX / 2,
            A4_HEIGHT_PX / 2,
          );
        }
      }

      // Initial preview - wait for image to fully load
      labelImg.addEventListener("load", () => {
        updateA4Preview();
      });

      labelImg.addEventListener("error", () => {
        console.error("Failed to load image:", labelImg.src);
        alert(
          "Failed to load product image. Make sure jelly_pudding.jpg and watalappan.jpg are in the same folder as index.html",
        );
      });

      // Trigger initial load
      if (labelImg.complete && labelImg.naturalWidth) {
        updateA4Preview();
      } else {
        labelImg.src = productSelect.value;
      }

      /* ==============
      Download Single PNG
      ============== */
      downloadBtn.addEventListener("click", () => {
        if (!labelImg.complete || !labelImg.naturalWidth) {
          alert("Please wait for the image to load.");
          return;
        }

        const w = labelImg.naturalWidth;
        const h = labelImg.naturalHeight;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");

        drawLabelOnCanvas(ctx, 0, 0, w);

        canvas.toBlob(
          (blob) => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "label.png";
            a.click();
          },
          "image/png",
          1.0,
        );
      });

      /* ==============
      Generate PDF (15 labels on A4)
      ============== */
      pdfBtn.addEventListener("click", async () => {
        if (!labelImg.complete || !labelImg.naturalWidth) {
          alert("Please wait for the image to load.");
          return;
        }

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF("p", "mm", "a4");

        // Create high-res label
        const w = labelImg.naturalWidth;
        const h = labelImg.naturalHeight;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");

        drawLabelOnCanvas(ctx, 0, 0, w);
        const base64 = canvas.toDataURL("image/png", 1.0);

        // PDF layout (same as preview)
        const labelSizeMM = 57;
        const paddingMM = 2;
        const marginXMM = 17.5;
        const marginYMM = 2;
        const cols = 3;
        const rows = 5;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = marginXMM + c * (labelSizeMM + paddingMM);
            const y = marginYMM + r * (labelSizeMM + paddingMM);
            pdf.addImage(base64, "PNG", x, y, labelSizeMM, labelSizeMM);
          }
        }

        pdf.save("labels.pdf");
      });

      /* ==============
      Reset Position
      ============== */
      resetBtn.addEventListener("click", () => {
        mfdOverlay.style.left = "27.3%";
        mfdOverlay.style.top = "49.8%";
        expOverlay.style.left = "27.3%";
        expOverlay.style.top = "58.6%";
        fontSize.value = 18;
        applyFontSize();
        updateA4Preview();
      });
    </script>
    <script>
      // Override product selection to use embedded images
      const originalListener = productSelect.onchange;
      productSelect.addEventListener("change", () => {
        const selectedProduct = productSelect.value;
        labelImg.src = IMAGES[selectedProduct];
        labelImg.onload = () => {
          updateA4Preview();
        };
      });

      // Set initial image
      labelImg.src = IMAGES.jelly;
    </script>
  </body>
</html>
